openapi: 3.0.0
info:
  title: My API Documentation
  description: This is the API documentation for my Symfony application
  version: 1.0.0
paths:
  /api/products:
    get:
      tags:
        - Products
      summary: Get a list of products
      responses:
        '200':
          description: Returns a list of products
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
                    price:
                      type: number
                      format: float